name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Runs every 14 minutes
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to backend
        run: |
          # Replace with your actual Render backend URL and health route
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://your-backend-service.onrender.com/)
          echo "Pinged Render backend. Status code: $RESPONSE"
